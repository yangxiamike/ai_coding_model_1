# Canonical preset: ashare_daily_cross_section v1.0.0
# 合作者只改 output_dir 和 zer0share.config_path；其余是版本化数据契约。
name: ashare_daily_cross_section_v1
schema_version: 1.0.0
preset:
  name: ashare_daily_cross_section
  version: 1.0.0
date_range:
  start: "20100101"
  end: "20251231"
universe:
  type: all_historical_a_shares
  exchanges: [SSE, SZSE, BSE]
  include_ts_codes: []
tables:
  stock_basic:
    [ts_code, symbol, name, area, industry, market, exchange, list_status, list_date, delist_date, is_hs]
  trade_cal:
    [exchange, cal_date, is_open, pretrade_date]
  daily:
    [ts_code, trade_date, open, high, low, close, pre_close, change, pct_chg, vol, amount]
  adj_factor:
    [ts_code, trade_date, adj_factor]
  daily_basic:
    [ts_code, trade_date, turnover_rate, turnover_rate_f, volume_ratio, pe, pe_ttm, pb, ps, ps_ttm, dv_ratio, dv_ttm, total_share, float_share, free_share, total_mv, circ_mv]
  stock_st:
    [ts_code, trade_date, name, type, type_name]
  suspend_d:
    [ts_code, trade_date, suspend_timing, suspend_type]
  stk_limit:
    [ts_code, trade_date, pre_close, up_limit, down_limit]
splits:
  train:
    start: "20100101"
    end: "20221230"
  validation:
    start: "20230201"
    end: "20231229"
  test:
    start: "20240201"
    end: "20251231"
default_view: training_view_hfq
output_dir: /replace/with/local/dataset-output
zer0share:
  config_path: /replace/with/local/zer0share-config.toml
